# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Validate LSCG
on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - name: Cache real-BC client (test/bc-client.json's pinned commit)
      uses: actions/cache@v6
      with:
        path: .cache/bc-*
        key: bc-client-${{ hashFiles('test/bc-client.json') }}
    # Both test projects in one run: "unit" and "bc" (against the cached real BC client), with
    # coverage. Fails if coverage drops below vitest.config.ts's thresholds.
    - run: npm run coverage:all
    - name: Coverage summary
      if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
      run: |
        node -e '
          const t = require("./coverage/coverage-summary.json").total;
          const rows = ["lines", "statements", "branches", "functions"].map(k => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`);
          console.log(["### Coverage", "| | % | covered |", "|---|---|---|", ...rows].join("\n"));
        ' >> "$GITHUB_STEP_SUMMARY"
