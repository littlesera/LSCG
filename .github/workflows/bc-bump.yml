# Watches BondageClub's `master` for a new release and, if LSCG's tests still
# pass against it, opens a PR bumping test/bc-client.json's pin (and bc-stubs,
# when a matching version is published). If tests fail, it files an issue
# instead of a PR, so the mod gets fixed before the pin moves.
#
# A PR opened here with the default GITHUB_TOKEN does not itself trigger
# validate.yml (GitHub's usual restriction on token-authored PRs), so the PR
# body links back to this run's own `test:bc` result instead.
name: Bump BC client pin

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - run: npm ci

      - name: Check whether BC master has moved
        id: check
        run: node scripts/bc-bump-check.mjs

      - name: Run tests against BC master
        if: steps.check.outputs.should_bump == 'true'
        id: test
        run: BC_CLIENT=latest npm run test:bc
        continue-on-error: true

      - name: Apply the pin bump
        if: steps.check.outputs.should_bump == 'true' && steps.test.outcome == 'success'
        run: node scripts/bc-bump-apply.mjs "${{ steps.check.outputs.sha }}" "${{ steps.check.outputs.game_version }}"

      - name: Look for a matching bc-stubs version
        if: steps.check.outputs.should_bump == 'true' && steps.test.outcome == 'success'
        id: stubs
        run: |
          MAJOR=$(echo "${{ steps.check.outputs.game_version }}" | grep -oE '[0-9]+' | head -1)
          MATCH=$(npm view bc-stubs versions --json \
            | node -e "const v=JSON.parse(require('fs').readFileSync(0,'utf8')); const m=v.filter(x=>x.startsWith('$MAJOR.')).sort().pop(); console.log(m||'');")
          echo "version=$MATCH" >> "$GITHUB_OUTPUT"
          if [ -n "$MATCH" ]; then npm install --save-exact "bc-stubs@$MATCH"; fi

      - name: Open a PR with the bump
        if: steps.check.outputs.should_bump == 'true' && steps.test.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.check.outputs.game_version }}"
          SHA="${{ steps.check.outputs.sha }}"
          BRANCH="bc-bump/$VERSION"
          STUBS="${{ steps.stubs.outputs.version }}"
          STUBS_NOTE="${STUBS:+bc-stubs bumped to $STUBS}"
          STUBS_NOTE="${STUBS_NOTE:-No published bc-stubs version matches $VERSION yet -- left unchanged.}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add test/bc-client.json package.json package-lock.json
          git commit -m "Bump BC client pin to $VERSION"
          git push origin "$BRANCH" --force

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number -q '.[0].number')
          BODY="Automated bump. \`test:bc\` passed against BC master @ $SHA in this run's own \"Run tests against BC master\" step (a PR opened with the default token doesn't trigger validate.yml itself -- see this run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). $STUBS_NOTE"
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --body "$BODY"
          else
            gh pr create --title "Bump BC client pin to $VERSION" --body "$BODY" --base dev --head "$BRANCH"
          fi

      - name: File (or update) an issue on failure
        if: steps.check.outputs.should_bump == 'true' && steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.check.outputs.game_version }}"
          SHA="${{ steps.check.outputs.sha }}"
          BODY="\`BC_CLIENT=latest npm run test:bc\` failed against BC master @ $SHA. See the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --search "\"BC client bump to\" in:title is:open" --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing as of $VERSION ($SHA).

          $BODY"
          else
            gh issue create --title "BC client bump to $VERSION failed tests" --body "$BODY"
          fi
